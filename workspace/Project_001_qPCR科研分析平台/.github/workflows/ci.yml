name: qPCR platform CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  r-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: services/analysis-r
          packages: |
            any::plumber
            any::ggplot2
            any::svglite
            any::ragg
            any::openxlsx
            any::emmeans
            any::multcomp
            any::lme4
            any::lmerTest
            any::rstatix
            any::zip
            any::digest
      - run: Rscript services/analysis-r/tests/test_statistics.R
      - run: Rscript services/analysis-r/tests/test_figures.R
      - run: Rscript services/analysis-r/tests/test_export.R
      - run: Rscript services/analysis-r/tests/test_service.R
